<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#231a12" />
  <title>Nomads</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Nomads</h1>
    <p class="clock" aria-live="off"><span id="phase" class="phase"></span><span id="day">Day 1</span><span id="time" class="time">--:--</span></p>
    <div class="controls">
      <button id="play" type="button" aria-label="Pause"></button>
      <button id="speed" type="button" aria-label="Change speed">1×</button>
      <button id="fit" type="button" aria-label="Show the whole map">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <main>
    <canvas id="map" aria-label="World map. Drag to pan, pinch or scroll to zoom, tap a person to open their ledger."></canvas>
    <p id="banner" class="banner" hidden></p>
  </main>

  <aside id="panel" class="panel" data-open="true">
    <button id="grip" class="grip" type="button" aria-label="Show or hide the panel"><span></span></button>
    <nav class="tabs" id="tabs">
      <button type="button" data-tab="people" aria-selected="true">People</button>
      <button type="button" data-tab="chronicle" aria-selected="false">Chronicle</button>
      <span id="jev" class="jev"></span>
    </nav>
    <section id="people" class="view"></section>
    <section id="chronicle" class="view" hidden>
      <div id="filters" class="filters"></div>
      <ol id="feed" class="feed"></ol>
    </section>
    <section id="inspect" class="view" hidden></section>
  </aside>

  <script type="module" src="app.js"></script>
</body>
</html>
