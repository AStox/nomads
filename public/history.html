<!doctype html>
<html lang="en" class="sub">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#231a12" />
  <title>Nomads history</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .hist {
      max-width: 1200px; margin: 0 auto; min-height: 100vh;
      padding-top: calc(var(--bar-h) + env(safe-area-inset-top));
      padding-bottom: calc(40px + env(safe-area-inset-bottom));
      background: var(--grain), var(--paper);
      box-shadow: 0 0 40px rgb(0 0 0 / .45);
    }
    .hist .top { padding: 20px 18px 12px; }
    .hist h2 { margin: 0 0 4px; font: 400 23px/1.2 "IM Fell English", serif; }

    .chart { margin-top: 16px; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: crosshair; }
    .chart svg { display: block; overflow: visible; }
    .chart .s0 { fill: rgb(122 150 84 / .1); }
    .chart .s1 { fill: rgb(217 181 108 / .17); }
    .chart .s2 { fill: rgb(168 96 40 / .1); }
    .chart .s3 { fill: rgb(110 140 175 / .17); }
    .chart .season { font: italic 400 12px "IM Fell English", serif; fill: var(--ink-faint); text-anchor: middle; }
    .chart .lane { font: 400 14px "IM Fell English SC", serif; fill: var(--ink-soft); letter-spacing: .03em; }
    .chart .lane-n { font: 400 11px "Alegreya Sans", sans-serif; fill: var(--ink-faint); font-variant-numeric: tabular-nums; }
    .chart .rule { stroke: var(--rule); }
    .chart .mark { font: italic 400 12px "IM Fell English", serif; fill: var(--ink); }
    .chart .seal { stroke: var(--paper); stroke-width: 1.3; }
    .chart .tick { font: 400 11px "Alegreya Sans", sans-serif; fill: var(--ink-faint); text-anchor: middle; font-variant-numeric: tabular-nums; }
    .chart .sel { fill: rgb(51 37 26 / .09); }
    .chart .sel-line { stroke: var(--seal); stroke-width: 1.2; }

    .scrub { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 14px; color: var(--ink-soft); }
    .scrub input { flex: 1; min-width: 0; min-height: 32px; accent-color: var(--seal); }
    .scrub output { min-width: 3ch; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }

    .hist .filters { top: calc(var(--bar-h) + env(safe-area-inset-top)); }
    .hist .filters button { padding: 4px 14px; }
    .hist .feed .day { top: calc(var(--bar-h) + env(safe-area-inset-top) + 49px); }
    .hist .ev .row { display: grid; grid-template-columns: 54px 1fr; gap: 8px; padding: 6px 18px; }
    .hist .ev time i { display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: var(--c); vertical-align: 1px; }
    .hist .ev.big .row { box-shadow: inset 3px 0 0 var(--c); background: linear-gradient(90deg, rgb(217 181 108 / .22), transparent 70%); }
    .hist .cat { display: flex; align-items: center; gap: 8px; padding: 14px 18px 2px; font: 400 14px/1 "IM Fell English SC", serif; letter-spacing: .05em; color: var(--ink-soft); }
    .hist .cat i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
    .hist .cat b { margin-left: auto; font: 400 12px "Alegreya Sans", sans-serif; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
    .hist .also { padding: 14px 18px 0; }
    .hist .empty { padding: 18px; }

    @media (max-width: 560px) {
      .hist .top { padding: 16px 12px 10px; }
      .hist .ev .row { padding: 6px 12px; }
      .hist .cat, .hist .also, .hist .empty { padding-left: 12px; padding-right: 12px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>History</h1>
    <a class="home" href="./" aria-label="Back to the map">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Back to the map</span>
    </a>
    <p id="stamp" class="stamp" aria-live="off"></p>
  </header>

  <div class="hist">
    <section class="top" aria-labelledby="h-title">
      <h2 id="h-title">What happened, day by day</h2>
      <p class="muted">Bars show how much went on each day. Seals mark the big moments. Tap a day to read it.</p>
      <p id="trimmed" class="muted small gap" hidden>The oldest days have fallen out of the record.</p>
      <div id="chart" class="chart" role="img" aria-label="Events per day, by kind"></div>
      <label class="scrub"><span>Day</span><input id="day" type="range" min="1" max="1" step="1" value="1" /><output id="day-out" for="day">1</output></label>
    </section>
    <nav class="filters" id="modes" aria-label="What to list">
      <button type="button" data-mode="milestones" aria-pressed="true">Milestones</button>
      <button type="button" data-mode="day" aria-pressed="false">Day 1</button>
    </nav>
    <ol id="list" class="feed"><li class="muted empty">Loading...</li></ol>
  </div>

  <script type="module" src="history.js"></script>
</body>
</html>
