<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nomads: looks</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
  "@dgreenheck/ez-tree": "https://cdn.jsdelivr.net/npm/@dgreenheck/ez-tree@1.1.0/build/ez-tree.es.js"
} }
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10141c; color: #eef0f4; font: 14px/1.4 system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100vw !important; height: 100vh !important; display: block; }
  nav { position: fixed; left: 16px; bottom: 16px; display: flex; flex-wrap: wrap; gap: 14px; padding: 10px 14px; border-radius: 10px; background: rgba(12, 16, 24, 0.6); backdrop-filter: blur(8px); }
  nav span { display: flex; gap: 6px; align-items: center; }
  nav b { font-weight: 600; opacity: 0.7; margin-right: 2px; }
  nav a { color: inherit; text-decoration: none; padding: 2px 8px; border-radius: 6px; border: 1px solid transparent; }
  nav a:hover { border-color: rgba(255, 255, 255, 0.35); }
  nav a.on { background: rgba(255, 255, 255, 0.16); }
  nav a:focus-visible { outline: 2px solid #ffd66b; }
  #loading { position: fixed; right: 20px; bottom: 20px; }
  body.clean nav, [hidden] { display: none; }
</style>
</head>
<body>
<nav aria-label="Look and view">
  <span><b>Look</b><a data-look="ink">Ink</a><a data-look="riso">Riso</a><a data-look="glow">Glow</a><a data-look="comic">Ligne claire</a><a data-look="aero">Aerochrome</a></span>
  <span><b>View</b><a data-view="island">Island</a><a data-view="valley">Valley</a><a data-view="camp">Camp</a></span>
</nav>
<div id="loading" role="status">Growing the island…</div>
<script>
  addEventListener("error", (e) => { document.getElementById("loading").textContent = `Couldn't draw it: ${e.message}`; });
  addEventListener("unhandledrejection", (e) => { document.getElementById("loading").textContent = `Couldn't draw it: ${e.reason?.message ?? e.reason}`; });
</script>
<script type="module" src="looks.js"></script>
</body>
</html>
