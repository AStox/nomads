<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Nomads: live</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0b14; }
  canvas#view { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; touch-action: none; cursor: grab; }
  canvas#view.dragging { cursor: grabbing; }
  #hint, #stats { position: fixed; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; color: #eef2f6; pointer-events: none; }
  #hint { left: 12px; bottom: 10px; padding: 5px 9px; background: rgba(13, 11, 20, 0.66); border-radius: 3px; transition: opacity 1.2s; }
  #hint.gone { opacity: 0; }
  canvas#inspector { position: fixed; left: 12px; top: 12px; width: 368px; height: 464px; image-rendering: pixelated; }
  canvas#inspector[hidden] { display: none; }
  canvas#pace { position: fixed; right: 12px; bottom: 10px; image-rendering: pixelated; pointer-events: none; }
  canvas#pace[hidden] { display: none; }
  canvas#render { position: fixed; right: 12px; top: 10px; image-rendering: pixelated; }
  canvas#render[hidden] { display: none; }
  #stats { right: 10px; top: 44px; padding: 5px 9px; background: rgba(13, 11, 20, 0.72); white-space: pre; border-radius: 3px; }
</style>
</head>
<body>
<canvas id="view" aria-label="Drag to pan, scroll or pinch to zoom, Q and E or right-drag to turn, click anything to inspect it"></canvas>
<canvas id="inspector" hidden aria-label="What is selected, from the sim"></canvas>
<div id="hint">drag to pan &middot; scroll or double-click to zoom &middot; Q/E or right-drag to turn &middot; click anything to inspect it, people and animals to follow &middot; Tab for the next person &middot; Esc or click it again to let go &middot; space pauses &middot; [ ] speed</div>
<canvas id="pace" hidden aria-label="The sim is paused or running at another speed"></canvas>
<canvas id="render" hidden aria-label="What draws the frames: the GPU through WebGL2, or the CPU and why"></canvas>
<div id="stats" hidden></div>
<script type="module" src="./main.js"></script>
</body>
</html>
