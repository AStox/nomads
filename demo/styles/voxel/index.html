<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nomads: voxel diorama</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #dbe6e9; }
  canvas#view { display: block; width: 100vw; height: 100vh; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="view"></canvas>
<script>
  // Registered before the module graph loads, so a failed import still marks the page failed.
  const fail = (e) => { document.body.dataset.error = String(e?.stack || e); document.body.classList.add("failed"); };
  addEventListener("error", (e) => fail(e.error || e.message));
  addEventListener("unhandledrejection", (e) => fail(e.reason));
</script>
<script type="module" src="./main.js" onerror="fail('main.js failed to load')"></script>
</body>
</html>
