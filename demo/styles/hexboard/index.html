<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nomads: hex board</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #efe3d3; }
  canvas#view { display: block; width: 100vw; height: 100vh; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/" } }
</script>
<script>
  const fail = (e) => { document.body.dataset.error = String((e && (e.stack || e.message)) || e); document.body.classList.add("failed"); };
  addEventListener("error", (e) => fail(e.error || e.message));
  addEventListener("unhandledrejection", (e) => fail(e.reason));
</script>
</head>
<body>
<canvas id="view"></canvas>
<script type="module" src="./main.js" onerror="fail('main.js failed to load')"></script>
</body>
</html>
