<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nomads: Old School</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas#view { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="view" width="1280" height="720"></canvas>
<script type="module">
const fail = (e) => { document.body.dataset.error = String((e && (e.stack || e.reason?.stack || e.reason || e.message)) || e); document.body.classList.add("failed"); };
addEventListener("error", (e) => fail(e.error || e.message));
addEventListener("unhandledrejection", (e) => fail(e.reason));
import("./main.js").then((m) => m.run()).then(() => document.body.classList.add("ready")).catch(fail);
</script>
</body>
</html>
