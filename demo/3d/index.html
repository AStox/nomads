<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nomads: the island in 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" media="print" onload="this.media = 'all'">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/" } }
</script>
<style>
  :root { --ink: #f6f3ea; --dim: #c9d0ea; --accent: #ffd66b; --edge: rgba(255, 255, 255, 0.28); }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1030; }
  body { color: var(--ink); font: 15px/1.35 "Pixelify Sans", ui-monospace, monospace; }
  #view { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  .win { background: linear-gradient(160deg, rgba(66, 98, 204, 0.55), rgba(14, 22, 72, 0.64)); backdrop-filter: blur(10px) saturate(1.2); -webkit-backdrop-filter: blur(10px) saturate(1.2); border: 1px solid var(--edge); border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 20, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.22); padding: 12px 16px; text-shadow: 0 1px 2px rgba(0, 0, 20, 0.5); }
  .win h1, .win h2 { margin: 0 0 4px; font-weight: 600; letter-spacing: 1px; }
  .win h1 { font-size: 22px; }
  .win h2 { font-size: 15px; color: var(--dim); }
  .win p { margin: 0; }
  #hud { position: fixed; inset: 16px; pointer-events: none; }
  #hud .win { position: absolute; pointer-events: auto; animation: arrive 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  #card { top: 0; left: 0; width: min(360px, calc(100vw - 32px)); }
  #people { top: 0; right: 0; animation-delay: 0.08s !important; }
  #keys { bottom: 0; left: 0; animation-delay: 0.16s !important; }
  @keyframes arrive { from { opacity: 0; transform: translateY(-8px); } }
  #mode { color: var(--dim); margin-top: 2px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  button { font: inherit; color: inherit; text-shadow: inherit; white-space: nowrap; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 8px; padding: 4px 12px; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.15s; }
  button:hover { background: rgba(255, 255, 255, 0.18); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  #list button { width: 100%; display: flex; align-items: center; gap: 8px; text-align: left; background: none; border-color: transparent; }
  #list button:hover, #list button.on { border-color: var(--accent); background: rgba(255, 255, 255, 0.08); }
  #list i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.8); }
  #keys dl { display: grid; grid-template-columns: auto auto; gap: 1px 14px; margin: 0; }
  #keys dt { color: var(--accent); }
  #keys dd { margin: 0; }
  .tag { position: fixed; left: 0; top: 0; font-size: 13px; padding: 1px 8px; background: rgba(14, 22, 72, 0.7); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); border: 1px solid rgba(255, 255, 255, 0.25); border-left: 4px solid var(--c); border-radius: 6px; white-space: nowrap; }
  #loading { position: fixed; right: 24px; bottom: 24px; font-size: 20px; letter-spacing: 2px; }
  #loading span { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (max-width: 720px) { #keys { display: none; } }
  @media (prefers-reduced-motion: reduce) { #hud .win, #loading span { animation: none; } }
</style>
</head>
<body>
<canvas id="view" aria-label="The island in 3D"></canvas>
<div id="tags"></div>
<main id="hud">
  <section class="win" id="card">
    <h1>Nomads</h1>
    <p id="where"></p>
    <p id="mode"></p>
    <div class="row"><button id="walk" type="button">Walk</button><button id="lens" type="button">Lens on</button><button id="time" type="button">Time</button><button id="next" type="button">New island</button></div>
  </section>
  <section class="win" id="people" aria-labelledby="people-title">
    <h2 id="people-title">People</h2>
    <ul id="list"></ul>
  </section>
  <section class="win" id="keys" aria-labelledby="keys-title">
    <h2 id="keys-title">Controls</h2>
    <dl>
      <dt>Drag</dt><dd>Turn</dd>
      <dt>Right drag</dt><dd>Pan</dd>
      <dt>Scroll</dt><dd>Zoom</dd>
      <dt>WASD</dt><dd>Move</dd>
      <dt>1 to 5</dt><dd>Follow someone</dd>
      <dt>0</dt><dd>Stop following</dd>
      <dt>E</dt><dd>Walk or fly</dd>
      <dt>T</dt><dd>Time of day</dd>
      <dt>L</dt><dd>Tilt-shift lens</dd>
      <dt>N</dt><dd>New island</dd>
      <dt>H</dt><dd>Hide this</dd>
    </dl>
  </section>
</main>
<div id="loading" class="win" role="status">Now loading<span>...</span></div>
<script>
  addEventListener("error", (e) => { document.getElementById("loading").textContent = `Couldn't start: ${e.message}`; });
</script>
<script type="module" src="main.js"></script>
</body>
</html>
